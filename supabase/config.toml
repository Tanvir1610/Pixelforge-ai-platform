# Supabase CLI project configuration.
# Link with:  supabase link --project-ref dggzgtwwzbzvepejpchq
project_id = "dggzgtwwzbzvepejpchq"

[db]
# Supabase never shipped Postgres 16 as a hosted major version (15 -> 17), so the
# CLI rejects it outright: "Invalid db.major_version: 16". This matches what the
# linked project actually runs. It governs the local `supabase start` stack; a
# push to a remote uses the remote's own version.
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
file_size_limit = "50MiB"
